# PostgreSQL for Strapi (tbbe). Creates the shared network postgres_tbpg_net that every other
# stack joins, so containers reach each other by name (tbpgdb, tbbe, tbwwwp, tbrun-offline).
# Port 5433 is bound to this server only (127.0.0.1) - reach it from another machine with an
# SSH tunnel: ssh -N -L 5433:localhost:5433 <server>
services:
  tbpgdb:
    image: postgres:${POSTGRES_TAG:-16}
    container_name: tbpgdb
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_db:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro     # runs once, on an empty database only
    networks:
      - tbpg_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional web admin for PostgreSQL. Start it only when needed:
  #   docker compose --profile tools up -d pgadmin4
  # then open http://localhost:5050 through an SSH tunnel: ssh -N -L 5050:localhost:5050 <server>
  pgadmin4:
    image: dpage/pgadmin4:${PGADMIN_TAG:-latest}
    container_name: pgadmin4
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in .env}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - postgres_pgadmin:/var/lib/pgadmin
    networks:
      - tbpg_net

volumes:
  postgres_db:
    external: true          # created by scripts/02-create-volumes.sh, survives "docker compose down"
  postgres_pgadmin:
    external: true

networks:
  tbpg_net: {}              # Compose names it postgres_tbpg_net
