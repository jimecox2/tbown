# Cloudflare Tunnel: an OUTBOUND connection from this server to Cloudflare - no inbound ports.
# One connector per server, with its own token in .env.local (chmod 600); the image tag in .env (deploy.sh).
# Published applications point at container names over tbnet (installation guide, section 12):
#   app hosts -> http://tbrun:80   Strapi -> http://tbbe:1337   website -> http://tbwwwp:3001
#   Cloud -> http://tbhelpapp:3010
services:
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:?run ./deploy.sh first, it sets CLOUDFLARED_TAG in .env}
    container_name: cloudflared
    restart: always
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    env_file: .env.local                # TUNNEL_TOKEN
    networks:
      - tbnet
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  tbnet:
    external: true          # shared by every Timebars container; created by 02-create-volumes.sh
