# The proxy on this server (the proxy method, guide section 8.3): Caddy answers every public address over
# HTTPS, gets a free Let's Encrypt certificate for each name and renews it, and passes each name to its
# container over tbnet. Not used with the Cloudflare tunnel method.
# Its only setting is the Caddyfile, written by 03-config.sh apply from ../tbapps.conf; the image tag is in
# .env (deploy.sh). Certificates live in the volume tbproxy_data - keep it: Let's Encrypt limits how many new
# certificates a domain may get per week.
services:
  tbproxy:
    image: caddy:${CADDY_TAG:?run ./deploy.sh first, it sets CADDY_TAG in .env}
    container_name: tbproxy
    restart: always
    ports:                    # the only container published on every address: users reach the server here
      - "80:80"               # Let's Encrypt checks and the redirect to https
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tbproxy_data:/data
      - tbproxy_config:/config
    networks:
      - tbnet
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tbproxy_data:
    name: tbproxy_data        # certificates and the Let's Encrypt account
  tbproxy_config:
    name: tbproxy_config

networks:
  tbnet:
    external: true            # shared by every Timebars container; created by 02-create-volumes.sh
