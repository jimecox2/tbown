# The proxy (Caddy): answers every public address of this environment over HTTPS and passes each name to
# its container over tbnet. Its only setting is the Caddyfile, generated by scripts/apply.sh on the dev box.
# Certificates: Let's Encrypt (TLS=letsencrypt) or Caddy's own local authority (TLS=internal), kept in the
# volume tbproxy_data - keep it: Let's Encrypt limits how many new certificates a domain may get per week.
# Not started when the environment uses your own proxy (PROXY=own): the Caddyfile is then the route list.
services:
  tbproxy:
    image: caddy:${CADDY_TAG:?run ./deploy.sh first, it sets CADDY_TAG in .env}
    container_name: tbproxy
    restart: always
    ports:                    # the only container published on every address: users reach the server here
      - "80:80"               # Let's Encrypt checks and the redirect to https
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tbproxy_data:/data
      - tbproxy_config:/config
    networks:
      - tbnet
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tbproxy_data:
    name: tbproxy_data        # certificates and the Let's Encrypt account
  tbproxy_config:
    name: tbproxy_config

networks:
  tbnet:
    external: true            # shared by every Timebars container; created by deploy-all.sh
